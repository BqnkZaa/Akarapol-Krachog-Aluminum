name: toolkit_app
description: "อัครพลกระจกอลูมิเนียม — ระบบคำนวณสูตรตัดประกอบ ถอดรายการ จัดเส้น ทำราคา และออกใบเสนอราคา"
publish_to: 'none'
version: 0.1.7+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.0
  pdf: ^3.11.1
  printing: ^5.13.4
  image_picker: ^1.1.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.4

dependency_overrides:
  image: 4.5.4

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/fonts/
    - assets/images/

  fonts:
    - family: Sarabun
      fonts:
        - asset: assets/fonts/Sarabun-Regular.ttf
          weight: 400
        - asset: assets/fonts/Sarabun-Bold.ttf
          weight: 700
